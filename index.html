<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Webpage</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #6a5acd, #00b4d8);
      color: #ffffff;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin-top: 0;
      font-size: 2.2em;
    }

    p {
      line-height: 1.5;
    }

    button {
      margin-top: 16px;
      padding: 12px 24px;
      font-size: 1em;
      border: none;
      border-radius: 8px;
      background: #ffffff;
      color: #6a5acd;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, Richard!</h1>
    <p>This is my first webpage, built with Claude Code.</p>
    <button onclick="this.textContent = 'Thanks for clicking!'">Click me</button>
  </div>
</body>
</html>
